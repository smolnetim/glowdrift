name: Release

# Pushing a tag such as v0.2.0 builds the Windows installer, signs the updater
# artifacts, and publishes a GitHub Release including latest.json. The manual
# trigger rebuilds and republishes an existing tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the release and upload assets
      id-token: write # build provenance attestation
      attestations: write # build provenance attestation
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Optional Authenticode signing through Azure Artifact Signing
      # (formerly Azure Trusted Signing). Skipped when any of these is absent.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, versions and signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Secret TAURI_SIGNING_PRIVATE_KEY is not set. The updater artifacts cannot be signed.'
          }
          ./scripts/check-version.ps1 -Tag $env:RELEASE_TAG

      - name: Decide on Authenticode signing
        id: authenticode
        shell: pwsh
        run: |
          $required = 'AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_TENANT_ID','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_SIGNING_PROFILE'
          $missing = $required | Where-Object { [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Authenticode signing skipped; missing: $($missing -join ', ')"
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Generate release notes from Conventional Commits
        id: notes
        shell: pwsh
        run: |
          ./scripts/release-notes.ps1 -Tag $env:RELEASE_TAG -OutFile "$env:RUNNER_TEMP/release-notes.md"
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value (Get-Content -Raw "$env:RUNNER_TEMP/release-notes.md").TrimEnd()
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
          $prerelease = if ($env:RELEASE_TAG.Contains('-')) { 'true' } else { 'false' }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # OPTIONAL: Authenticode code signing. Runs only when all Azure secrets are
      # present. Tauri calls signCommand for the app executable and the NSIS
      # installer during the build, so the updater signature that is computed
      # afterwards covers the Authenticode-signed installer.
      - name: Configure Authenticode signing (optional)
        if: steps.authenticode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          cargo install artifact-signing-cli --locked
          $command = 'artifact-signing-cli -e {0} -a {1} -c {2} -d Glowdrift %1' -f $env:AZURE_SIGNING_ENDPOINT, $env:AZURE_SIGNING_ACCOUNT, $env:AZURE_SIGNING_PROFILE
          $config = @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5
          Set-Content -Path apps/desktop/src-tauri/tauri.sign.conf.json -Value $config -Encoding utf8

      - name: Build installer and publish release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Glowdrift ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.authenticode.outputs.enabled == 'true' && '--config src-tauri/tauri.sign.conf.json' || '' }}

      # Artifact attestations on private repositories need GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig

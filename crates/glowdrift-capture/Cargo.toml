[package]
name = "glowdrift-capture"
description = "Windows monitor enumeration and DXGI Desktop Duplication capture for Glowdrift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
# Fills `GrabTimings::cpu` with thread cycle counts; costs a system call per timed span.
cpu-timing = []

[dependencies]
glowdrift-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

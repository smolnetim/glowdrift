[package]
name = "glowdrift-desktop"
description = "Glowdrift desktop app: ambient lighting driven by a smoothed screen colour."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
# Logs per-stage engine-loop timings and thread CPU time; see docs/profiling.md.
engine-timing = []

[lib]
name = "glowdrift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
glowdrift-core = { workspace = true }
glowdrift-capture = { workspace = true }
glowdrift-lights = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-process = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
sha2 = "0.10.9"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }

[lints]
workspace = true
